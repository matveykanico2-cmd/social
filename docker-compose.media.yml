services:
  minio:
    image: minio/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-shalter-local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-shalter-local-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  coturn:
    image: coturn/coturn:4.6.3
    command: >-
      -n --log-file=stdout --realm=${TURN_REALM:-localhost}
      --user=${TURN_USER:-shalter}:${TURN_PASSWORD:-change-me}
      --lt-cred-mech --fingerprint --no-cli
      --min-port=49160 --max-port=49200
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"

  mediamtx:
    image: bluenviron/mediamtx:latest
    ports:
      - "8554:8554"
      - "8889:8889"
      - "1935:1935"

volumes:
  minio-data:
